name: fetch-lottie
on:
  push:
    branches: [lottie-fetch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download free LottieFiles animations
        run: |
          mkdir -p lottie-src && cd lottie-src
          dl(){ curl -fsSL "$2" -o "$1.lottie" && mkdir -p "$1" && unzip -o -q "$1.lottie" -d "$1"; }
          mkdir -p json && while read n u; do curl -fsSL "$u" -o "json/$n.json" || echo "FAIL $n"; done < ../lottie-list.txt
          ls -laR
      - name: Commit
        run: |
          git config user.name "Gillani Group"
          git config user.email "noreply@anthropic.com"
          git add lottie-src
          git commit -m "Add downloaded LottieFiles sources" || true
          git push
